name: Library

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.agents/**'
      - 'plugins/*/skills/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/library.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.agents/**'
      - 'plugins/*/skills/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/library.yml'

permissions:
  contents: read

jobs:
  crud-and-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: No high or critical advisories in the non-optional tree
        # Optional deps are excluded: aidefence pins zod ^3 and no patched 3.x
        # exists (GHSA-mrhx-c7xc-m3w5); that needs an aidefence release.
        run: npm audit --omit=optional --audit-level=high
      - name: Typecheck and build
        run: npm run build:ts && npm run copy:schemas
      - name: CRUD, hybrid retrieval, ecosystem integration (incl. ruvllm API contract), graph, attention validation and RVF flush unit tests
        run: npx vitest run tests/unit/controllers/fann-models.test.ts tests/mcp-policy.test.ts tests/unit/controllers/crud-adr017.test.ts tests/unit/controllers/ReflexionMemory-hybrid.test.ts tests/unit/controllers/episode-rerank.test.ts tests/unit/search tests/unit/integrations tests/unit/controllers/MincutService.test.ts tests/unit/sparsification.test.ts tests/unit/node-runtime-floor.test.ts tests/better-sqlite3-statement-gc.test.ts tests/backends/federated-session.test.ts tests/backends/federated-coordinator-args.test.ts tests/unit/attention-edge-cases.test.ts tests/backends/rvf-flush-retry.test.ts tests/backends/rvf-backend-extended.test.ts tests/backends/rvf-04-metadata.test.ts tests/backends/rvf-absent-fallback.test.ts tests/backends/rvf-in-memory.test.ts tests/backends/rvf-049-upsert-lock.test.ts tests/db-fallback-native.test.ts
      - name: Neural MCP training and persistence
        run: npm run test:mcp-fann
      - name: MCP stdio purity
        run: npm run test:mcp-stdio
      - name: MCP CRUD end-to-end (sql.js and better-sqlite3)
        run: npm run test:mcp-crud

  build-without-optional-deps:
    # Optional dependencies may fail to install on a consumer's platform; the
    # TypeScript build must not depend on their type declarations.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Typecheck with no optional dependency installed
        run: npx tsc --noEmit -p .
